<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Analytics</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100">

<div id="app"></div>


<div
id="loader"

class="
fixed
inset-0
bg-black/10
z-50
flex
items-center
justify-center">

<div class="
w-16
h-16
rounded-full
border-[5px]
border-blue-100
border-t-blue-600
animate-spin
bg-white">
</div>

</div>



<script>

const API =
"https://skillearn.onrender.com";


const token =
localStorage.getItem(
"business_token"
);


const vendor =
JSON.parse(

localStorage.getItem(
"business_user"

));


if(
!token ||
!vendor
){

location =
"business-login.html";

}


load();




function money(){

return vendor.country==="NG"
? "₦"
: "$";

}




async function load(){

try{

const res =
await fetch(

API+
"/api/business/analytics",

{

headers:{

Authorization:
"Bearer "+
token

}

}

);


const data =
await res.json();


document
.getElementById(
"loader"
)
.style.display =
"none";


render(
data
);


}catch{

location =
"business-login.html";

}

}




function render(data){

document
.getElementById(
"app"
)
.innerHTML = `

<div class="
p-4
pb-28">




<div class="
mb-5">

<h1 class="
text-2xl
font-bold">

Analytics

</h1>

<p class="
text-slate-500">

Business performance

</p>

</div>





<div class="
grid
grid-cols-2
gap-4">



${card(

"💸",

"Today Spent",

money()+

Number(

data.today_spent || 0

).toLocaleString()

)}



${card(

"📅",

"This Month",

money()+

Number(

data.this_month || 0

).toLocaleString()

)}



${card(

"🚀",

"Campaigns",

data.total_campaigns || 0

)}



${card(

"👥",

"Workers",

data.total_workers || 0

)}



</div>

</div>






<div class="
fixed
bottom-0
left-0
right-0
bg-white
border-t
grid
grid-cols-4
p-3
text-center">

${nav(
"🏠",
"business-dashboard.html"
)}

${nav(
"➕",
"business-create-job.html"
)}

${nav(
"🔔",
"business-notifications.html"
)}

${nav(
"👤",
"business-profile.html"
)}

</div>

`;

}




function card(
icon,
title,
value
){

return `

<div class="
bg-white
rounded-[28px]
shadow
p-6">

<div class="
text-3xl
mb-3">

${icon}

</div>


<p class="
text-slate-500
text-sm">

${title}

</p>


<h2 class="
text-2xl
font-bold
mt-2">

${value}

</h2>

</div>

`;

}




function nav(
icon,
page
){

return `

<a
href="${page}"

class="
text-2xl">

${icon}

</a>

`;

}

</script>

</body>
  </html>

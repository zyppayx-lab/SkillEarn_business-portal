<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div id="app"></div>

<script>

const vendor=
JSON.parse(
localStorage.getItem("business_user")
);

if(!vendor){
location="business-login.html";
}

render();


function money(){

return vendor.country==="NG"
? "₦"
: "$";

}


function render(){

document.getElementById(
"app"
).innerHTML=`

<div class="p-4 pb-24">

<div class="mb-6">

<p class="text-slate-500">
Welcome
</p>

<h1 class="text-2xl font-bold">
${vendor.business_name}
</h1>

</div>


<div class="
bg-blue-600
text-white
rounded-3xl
p-8
mb-6">

<p>
Escrow Balance
</p>

<h1 class="
text-4xl
font-bold
mt-2">

${money()}0

</h1>

</div>



<div class="
grid
grid-cols-4
gap-3">

${btn(
"➕",
"Create",
"business-create-job.html"
)}

${btn(
"📥",
"Proofs",
"business-submissions.html"
)}

${btn(
"📊",
"Stats",
"business-analytics.html"
)}

${btn(
"👤",
"Profile",
"business-profile.html"
)}

</div>

</div>

`;

}


function btn(
icon,
text,
link
){

return `

<a
href="${link}"

class="
bg-white
p-4
rounded-3xl
text-center
shadow">

<div class="text-2xl">
${icon}
</div>

<div class="text-sm mt-1">
${text}
</div>

</a>

`;

}

</script>

</body>
</html>

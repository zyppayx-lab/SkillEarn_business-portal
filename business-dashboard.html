<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillEarn Business</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div id="app"></div>

<div id="loader"
class="fixed inset-0 bg-black/10 z-50 flex items-center justify-center">

<div class="
w-16 h-16 rounded-full border-[5px]
border-blue-100 border-t-blue-600
animate-spin bg-white"></div>

</div>


<script>

"use strict";


const app =
document.getElementById("app");


const loader =
document.getElementById("loader");


const token =
localStorage.getItem(
"business_token"
);


const vendor =
JSON.parse(

localStorage.getItem(
"business_user"
) || "{}"

);


if(!token){

location =
"business-login.html";

}



fetch(

"https://skillearn.onrender.com/api/business/dashboard",

{

headers:{

Authorization:
"Bearer "+token

}

}

)

.then(

async res=>{

let data =
await res.json();



loader.remove();



const escrow =

data.escrow ||

data.escrow_balance ||

(
data.wallet &&
data.wallet.escrow
) ||

0;



app.innerHTML = `

<div class="p-4 pb-28">



<div class="mb-5">

<p class="text-slate-500">
Welcome 👋
</p>

<h2 class="text-2xl font-bold">
${vendor.business_name || "Business"}
</h2>

</div>




<div class="
bg-blue-600
text-white
rounded-[28px]
p-8
shadow-xl
mb-5">

<p>
Escrow Balance
</p>

<h1 class="
text-4xl
font-bold
mt-2">

${vendor.country==="NG" ? "₦" : "$"}

${Number(
escrow
).toLocaleString()}

</h1>

</div>




<div class="
grid
grid-cols-4
gap-3
mb-6">



<a
href="business-create-job.html"
class="
bg-white
rounded-3xl
shadow
p-4
text-center">

<div class="text-2xl">
➕
</div>

<div class="text-sm font-semibold">
Create
</div>

</a>




<a
href="business-submissions.html"
class="
bg-white
rounded-3xl
shadow
p-4
text-center">

<div class="text-2xl">
📥
</div>

<div class="text-sm font-semibold">
Proofs
</div>

</a>




<a
href="business-payments.html"
class="
bg-white
rounded-3xl
shadow
p-4
text-center">

<div class="text-2xl">
💳
</div>

<div class="text-sm font-semibold">
Payments
</div>

</a>




<a
href="business-analytics.html"
class="
bg-white
rounded-3xl
shadow
p-4
text-center">

<div class="text-2xl">
📊
</div>

<div class="text-sm font-semibold">
Analytics
</div>

</a>



</div>




<div class="
bg-white
rounded-[28px]
p-5
shadow">

${row("📣","Social Tasks",data.social_tasks||0)}
${row("💻","Freelance Jobs",data.freelance_jobs||0)}
${row("🧑‍💼","Hiring Jobs",data.hiring_jobs||0)}
${row("⭐","Influencer Jobs",data.influencer_jobs||0)}
${row("📥","Pending Proofs",data.pending_submissions||0)}
${row("✅","Approved",data.approved_submissions||0)}

</div>

</div>




<div class="
fixed
bottom-0
left-0
right-0
bg-white
border-t
grid
grid-cols-4
p-3
text-center">

<a href="business-dashboard.html" class="text-2xl">🏠</a>
<a href="business-create-job.html" class="text-2xl">➕</a>
<a href="business-notifications.html" class="text-2xl">🔔</a>
<a href="business-profile.html" class="text-2xl">👤</a>

</div>

`;

}

)

.catch(

()=>{

loader.remove();

app.innerHTML = `
<div class="p-5">
Could not load dashboard
</div>
`;

}

);





function row(
icon,
name,
value
){

return `

<div class="
flex
justify-between
mb-4">

<div class="
flex
gap-3">

<span>${icon}</span>

<span>${name}</span>

</div>

<b>${value}</b>

</div>

`;

}

</script>

</body>
  </html>

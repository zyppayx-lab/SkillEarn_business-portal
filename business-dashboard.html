<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillEarn Business</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div id="app"></div>


<div
id="loader"

class="
fixed
inset-0
bg-black/10
z-50
flex
items-center
justify-center">

<div class="
w-16
h-16
rounded-full
border-[5px]
border-blue-100
border-t-blue-600
animate-spin
bg-white">
</div>

</div>


<script>

const API =
"https://skillearn.onrender.com";


const token =
localStorage.getItem(
"business_token"
);


const vendor =
JSON.parse(

localStorage.getItem(
"business_user"

));


if(
!token ||
!vendor
){

location =
"business-login.html";

}


load();




function money(){

return vendor.country==="NG"
? "₦"
: "$";

}




async function load(){

try{

const res =
await fetch(

API+
"/api/business/dashboard",

{

headers:{

Authorization:
"Bearer "+
token

}

}

);


const data =
await res.json();


document
.getElementById(
"loader"
)
.style.display =
"none";


render(
data
);


}catch{

location =
"business-login.html";

}

}




function render(data){

document
.getElementById(
"app"
)
.innerHTML = `

<div class="
p-4
pb-28">



<div class="
mb-5">

<p class="
text-slate-500">

Welcome 👋

</p>

<h2 class="
text-2xl
font-bold">

${vendor.business_name}

</h2>

</div>




<div class="
bg-blue-600
text-white
rounded-[28px]
p-8
shadow-xl
mb-5">

<p>
Escrow Balance
</p>

<h1 class="
text-4xl
font-bold
mt-2">

${money()}
${Number(
data.escrow || 0
).toLocaleString()}

</h1>

</div>




<div class="
grid
grid-cols-4
gap-3
mb-6">

${action(
"➕",
"Create",
"business-create-job.html"
)}

${action(
"📥",
"Proofs",
"business-submissions.html"
)}

${action(
"💳",
"Payments",
"business-payments.html"
)}

${action(
"📊",
"Analytics",
"business-analytics.html"
)}

</div>




<div class="
bg-white
rounded-[28px]
p-5
shadow">

<h2 class="
font-bold
mb-4">

Business Overview

</h2>


${row(
"📣",
"Social Tasks",
data.social_tasks || 0
)}

${row(
"💻",
"Freelance Jobs",
data.freelance_jobs || 0
)}

${row(
"🧑‍💼",
"Hiring Jobs",
data.hiring_jobs || 0
)}

${row(
"⭐",
"Influencer Jobs",
data.influencer_jobs || 0
)}

${row(
"📥",
"Pending Proofs",
data.pending_submissions || 0
)}

${row(
"✅",
"Approved",
data.approved_submissions || 0
)}

${row(
"💰",
"Spent",
money()+
Number(
data.total_spent || 0
).toLocaleString()
)}

</div>

</div>




<div class="
fixed
bottom-0
left-0
right-0
bg-white
border-t
grid
grid-cols-4
p-3
text-center">

${nav(
"🏠",
"business-dashboard.html"
)}

${nav(
"➕",
"business-create-job.html"
)}

${nav(
"🔔",
"business-notifications.html"
)}

${nav(
"👤",
"business-profile.html"
)}

</div>

`;

}




function action(
icon,
name,
page
){

return `

<a
href="${page}"

class="
bg-white
rounded-3xl
shadow
p-4
text-center">

<div class="
text-2xl">

${icon}

</div>

<div class="
text-sm
font-semibold">

${name}

</div>

</a>

`;

}




function row(
icon,
name,
value
){

return `

<div class="
flex
justify-between
mb-4">

<div class="
flex
gap-3">

<span>
${icon}
</span>

<span>
${name}
</span>

</div>

<b>
${value}
</b>

</div>

`;

}




function nav(
icon,
page
){

return `

<a
href="${page}"

class="
text-2xl">

${icon}

</a>

`;

}

</script>

</body>
  </html>

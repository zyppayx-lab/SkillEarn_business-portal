<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SkillEarn Business</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    font-family:sans-serif;
}

.nav-btn{
    transition:.25s;
}

.nav-btn:active{
    transform:scale(.85);
}

.float-card{
    animation:floatCard 3s infinite;
}

@keyframes floatCard{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }

    100%{
        transform:translateY(0);
    }

}

</style>

</head>

<body class="bg-slate-100">

<div id="app"></div>


<div
id="loader"

class="
fixed
inset-0
bg-black/10
z-50
flex
items-center
justify-center">

<div class="
w-16
h-16
rounded-full
border-[5px]
border-blue-100
border-t-blue-600
animate-spin
bg-white">
</div>

</div>



<script>

const token =
localStorage.getItem(
"business_token"
);


const vendor =
JSON.parse(

localStorage.getItem(
"business_user"
)

);


if(
!token
){

window.location =
"business-login.html";

}


load();




function currency(){

if(
vendor.country ===
"NG"
){
return "₦";
}

return "$";

}




async function load(){

try{


/*
until dashboard endpoint is added,
use local demo values
*/


const data = {

escrow:0,

active_jobs:0,

pending_submissions:0,

approved:0

};


document
.getElementById(
"loader"
)
.style.display =
"none";


render(
data
);


}catch{

window.location =
"business-login.html";

}

}




function render(data){

document
.getElementById(
"app"
)
.innerHTML = `

<div class="
pb-28
p-4">




<div class="
mb-5">

<p class="
text-slate-500">

Welcome 👋

</p>


<h2 class="
text-2xl
font-bold">

${vendor.business_name}

</h2>

</div>





<div class="
float-card
bg-blue-600
text-white
rounded-[28px]
p-8
text-center
shadow-xl
mb-5">

<p>
Escrow Balance
</p>


<h1 class="
text-4xl
font-bold
mt-2">

${currency()}
${Number(
data.escrow
).toLocaleString()}

</h1>

</div>






<div class="
grid
grid-cols-4
gap-3
mb-6">

${action(
"➕",
"Create",
"business-create-job.html"
)}

${action(
"💳",
"Fund",
"business-fund-wallet.html"
)}

${action(
"📥",
"Proofs",
"business-submissions.html"
)}

${action(
"📊",
"Stats",
"business-analytics.html"
)}

</div>






<div class="
grid
grid-cols-2
gap-4
mb-5">

${stat(
"Active Jobs",
data.active_jobs
)}

${stat(
"Pending Proofs",
data.pending_submissions
)}

${stat(
"Approved",
data.approved
)}

${stat(
"Escrow",
currency()+
data.escrow
)}

</div>






<div class="
bg-white
rounded-[28px]
p-5
shadow">

<h3 class="
font-bold
mb-4">

Recent Activity

</h3>


${activity(
"💼",
"Campaigns"
)}

${activity(
"💳",
"Payments"
)}

${activity(
"📥",
"Submissions"
)}

</div>

</div>






<div class="
fixed
bottom-0
left-0
right-0
bg-white
shadow-2xl
border-t
grid
grid-cols-4
p-3
text-center">

${nav(
"🏠",
"business-dashboard.html"
)}

${nav(
"💼",
"business-create-job.html"
)}

${nav(
"🔔",
"business-notifications.html"
)}

${nav(
"👤",
"business-profile.html"
)}

</div>

`;

}





function action(
icon,
name,
page
){

return `

<a

href="${page}"

class="
bg-white
rounded-3xl
shadow
p-4
text-center">

<div class="
text-2xl
mb-1">

${icon}

</div>


<div class="
text-sm
font-semibold">

${name}

</div>

</a>

`;

}




function stat(
name,
value
){

return `

<div class="
bg-white
rounded-[24px]
p-5
shadow">

<p class="
text-slate-500
text-sm">

${name}

</p>


<h3 class="
font-bold
text-xl
mt-2">

${value}

</h3>

</div>

`;

}




function activity(
icon,
text
){

return `

<div class="
flex
gap-3
mb-3">

<span>

${icon}

</span>


<span>

${text}

</span>

</div>

`;

}




function nav(
icon,
page
){

return `

<a

href="${page}"

class="
nav-btn
text-2xl">

${icon}

</a>

`;

}

</script>

</body>
  </html>

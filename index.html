<!-- FILE: business-login.html            -->
<!-- SkillEarn Business Login/Register    -->
<!-- reCAPTCHA v3 FIXED VERSION           -->
<!-- ===================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SkillEarn Business Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- RECAPTCHA v3 -->
<script src="https://www.google.com/recaptcha/api.js?render=6Lel28gsAAAAAMKCUTsgpVkpivxqwUel3n-4vpNx"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1d4ed8,#06b6d4);
padding:20px;
}

.container{
width:100%;
max-width:470px;
background:rgba(255,255,255,.96);
padding:34px;
border-radius:24px;
box-shadow:0 25px 60px rgba(0,0,0,.18);
backdrop-filter:blur(12px);
}

.logo{
text-align:center;
font-size:32px;
font-weight:800;
margin-bottom:8px;
color:#2563eb;
}

.logo span{color:#111827;}

.sub{
text-align:center;
color:#6b7280;
margin-bottom:28px;
font-size:14px;
}

.tabs{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:22px;
}

.tab{
padding:12px;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
background:#e5e7eb;
}

.tab.active{
background:#2563eb;
color:#fff;
}

.form{display:none;}
.form.active{display:block;}

.input{
width:100%;
padding:14px;
margin-bottom:14px;
border-radius:12px;
border:1px solid #d1d5db;
outline:none;
font-size:15px;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-weight:800;
cursor:pointer;
font-size:15px;
margin-top:12px;
background:#2563eb;
color:#fff;
}

.note{
text-align:center;
font-size:13px;
color:#6b7280;
margin-top:16px;
}

.status{
margin-top:14px;
text-align:center;
font-weight:700;
font-size:14px;
}

.success{color:#059669;}
.error{color:#dc2626;}
</style>
</head>

<body>

<div class="container">

<div class="logo">Skill<span>Earn</span></div>
<div class="sub">Business Portal • Run jobs, campaigns & hire talent</div>

<div class="tabs">
<button class="tab active" onclick="showTab('login')">Login</button>
<button class="tab" onclick="showTab('register')">Register</button>
</div>

<!-- LOGIN -->
<div id="login" class="form active">
<input class="input" id="loginEmail" type="email" placeholder="Business Email">
<input class="input" id="loginPassword" type="password" placeholder="Password">

<button class="btn" onclick="login()">Login Business Account</button>
</div>

<!-- REGISTER -->
<div id="register" class="form">
<input class="input" id="name" type="text" placeholder="Business Name">
<input class="input" id="country" type="text" placeholder="Country">
<input class="input" id="email" type="email" placeholder="Business Email">
<input class="input" id="phone" type="text" placeholder="Phone Number">
<input class="input" id="password" type="password" placeholder="Password">

<button class="btn" onclick="register()">Create Business Account</button>
</div>

<div id="status" class="status"></div>

<div class="note">
Protected with reCAPTCHA v3 Security System
</div>

</div>

<script>
const API = "https://skillearn.onrender.com";

function showTab(id){
document.querySelectorAll(".form").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));

document.getElementById(id).classList.add("active");
event.target.classList.add("active");
}

function msg(text,type){
const el = document.getElementById("status");
el.innerText = text;
el.className = "status " + type;
}

/* LOGIN */
async function login(){

grecaptcha.ready(function() {
grecaptcha.execute('6Lel28gsAAAAAMKCUTsgpVkpivxqwUel3n-4vpNx', {action: 'login'}).then(async function(token) {

const res = await fetch(API + "/api/auth/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:document.getElementById("loginEmail").value,
password:document.getElementById("loginPassword").value,
recaptchaToken:token
})
});

const data = await res.json();

if(data.access){
localStorage.setItem("token",data.access);
msg("Login successful","success");

setTimeout(()=>{
window.location.href="business-dashboard.html";
},1000);

}else{
msg(data.message || "Login failed","error");
}

});

});

}

/* REGISTER */
async function register(){

grecaptcha.ready(function() {
grecaptcha.execute('6Lel28gsAAAAAMKCUTsgpVkpivxqwUel3n-4vpNx', {action: 'register'}).then(async function(token) {

const res = await fetch(API + "/api/auth/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:document.getElementById("name").value,
country:document.getElementById("country").value,
email:document.getElementById("email").value,
phone:document.getElementById("phone").value,
password:document.getElementById("password").value,
recaptchaToken:token
})
});

const data = await res.json();

if(data.id){
msg("Registration successful. Login now.","success");
}else{
msg(data.message || "Registration failed","error");
}

});

});

}
</script>

</body>
</html>

<!-- ===================================== -->
<!-- SkillEarn Business Login/Register    -->
<!-- reCAPTCHA v3 + Loader + Debug Button -->
<!-- ===================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SkillEarn Business Access</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Google reCAPTCHA v3 -->
<script src="https://www.google.com/recaptcha/api.js?render=6Lel28gsAAAAAMKCUTsgpVkpivxqwUel3n-4vpNx"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(135deg,#0f172a,#1d4ed8,#06b6d4);
}

.container{
width:100%;
max-width:470px;
background:#fff;
padding:30px;
border-radius:22px;
box-shadow:0 20px 60px rgba(0,0,0,.18);
}

h2{
text-align:center;
margin-bottom:20px;
color:#2563eb;
}

.input{
width:100%;
padding:13px;
margin-bottom:12px;
border-radius:12px;
border:1px solid #ddd;
outline:none;
font-size:15px;
}

.btn{
width:100%;
padding:13px;
border:none;
border-radius:12px;
background:#2563eb;
color:#fff;
font-weight:700;
font-size:15px;
cursor:pointer;
margin-top:10px;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
}

.btn:disabled{
opacity:.65;
cursor:not-allowed;
}

.loader{
width:16px;
height:16px;
border:2px solid #fff;
border-top:2px solid transparent;
border-radius:50%;
display:none;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

.status{
margin-top:15px;
text-align:center;
font-weight:700;
font-size:14px;
}

.success{color:#059669;}
.error{color:#dc2626;}

hr{
margin:22px 0;
border:none;
border-top:1px solid #eee;
}

.note{
margin-top:15px;
font-size:13px;
text-align:center;
color:#666;
}
</style>
</head>

<body>

<div class="container">

<h2>SkillEarn Business</h2>

<!-- LOGIN -->
<input class="input" id="loginEmail" type="email" placeholder="Business Email">
<input class="input" id="loginPassword" type="password" placeholder="Password">

<button class="btn" id="loginBtn" onclick="login()">
<span class="loader" id="loginLoader"></span>
<span>Login</span>
</button>

<hr>

<!-- REGISTER -->
<input class="input" id="name" placeholder="Business Name">
<input class="input" id="country" placeholder="Country">
<input class="input" id="email" type="email" placeholder="Business Email">
<input class="input" id="phone" placeholder="Phone Number">
<input class="input" id="password" type="password" placeholder="Password">

<button class="btn" id="registerBtn" onclick="register()">
<span class="loader" id="registerLoader"></span>
<span>Create Account</span>
</button>

<!-- DEBUG BUTTON -->
<button class="btn" id="debugBtn" onclick="debugCaptcha()" style="background:#111827;">
<span class="loader" id="debugLoader"></span>
<span>Test reCAPTCHA</span>
</button>

<div id="status" class="status"></div>

<div class="note">
Protected with reCAPTCHA v3 Security System
</div>

</div>

<script>
const API = "https://skillearn.onrender.com";
const SITE_KEY = "6Lel28gsAAAAAMKCUTsgpVkpivxqwUel3n-4vpNx";

/* =========================
   LOADER
========================= */
function setLoading(btnId, loaderId, state){
document.getElementById(btnId).disabled = state;
document.getElementById(loaderId).style.display = state ? "block" : "none";
}

/* =========================
   STATUS
========================= */
function showStatus(msg,type=""){
const el = document.getElementById("status");
el.innerText = msg;
el.className = "status " + type;
}

/* =========================
   CAPTCHA TOKEN
========================= */
function getCaptcha(action){
return new Promise((resolve,reject)=>{

if(typeof grecaptcha === "undefined"){
reject("reCAPTCHA script not loaded");
return;
}

grecaptcha.ready(()=>{
grecaptcha.execute(SITE_KEY,{action})
.then(token => resolve(token))
.catch(err => reject(err));
});

});
}

/* =========================
   LOGIN
========================= */
async function login(){

setLoading("loginBtn","loginLoader",true);
showStatus("Logging in...");

try{

const token = await getCaptcha("login");

const res = await fetch(API + "/api/auth/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:document.getElementById("loginEmail").value,
password:document.getElementById("loginPassword").value,
recaptchaToken:token
})
});

const data = await res.json();

if(data.access){
showStatus("Login successful","success");
localStorage.setItem("token",data.access);
}else{
showStatus(data.message || "Login failed","error");
}

}catch(err){
showStatus("Login error","error");
alert(err);
}

setLoading("loginBtn","loginLoader",false);
}

/* =========================
   REGISTER
========================= */
async function register(){

setLoading("registerBtn","registerLoader",true);
showStatus("Creating account...");

try{

const token = await getCaptcha("register");

const res = await fetch(API + "/api/auth/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:document.getElementById("name").value,
country:document.getElementById("country").value,
email:document.getElementById("email").value,
phone:document.getElementById("phone").value,
password:document.getElementById("password").value,
recaptchaToken:token
})
});

const data = await res.json();

if(data.id){
showStatus("Registration successful","success");
}else{
showStatus(data.message || "Registration failed","error");
}

}catch(err){
showStatus("Register error","error");
alert(err);
}

setLoading("registerBtn","registerLoader",false);
}

/* =========================
   DEBUG CAPTCHA
========================= */
async function debugCaptcha(){

setLoading("debugBtn","debugLoader",true);
showStatus("Testing reCAPTCHA...");

try{

const token = await getCaptcha("login");

if(token && token.length > 20){
showStatus("Token generated successfully","success");
alert("TOKEN:\\n\\n" + token);
}else{
showStatus("No token generated","error");
}

}catch(err){
showStatus("reCAPTCHA failed","error");
alert("ERROR:\\n\\n" + err);
}

setLoading("debugBtn","debugLoader",false);
}
</script>

</body>
   </html>

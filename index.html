<!-- ===================================== -->
<!-- SkillEarn Business Login/Register    -->
<!-- reCAPTCHA v3 + Loader FIXED VERSION  -->
<!-- ===================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SkillEarn Business Access</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.google.com/recaptcha/api.js?render=6Lel28gsAAAAAMKCUTsgpVkpivxqwUel3n-4vpNx"></script>

<style>
body{
font-family:Inter,sans-serif;
background:linear-gradient(135deg,#0f172a,#1d4ed8,#06b6d4);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:100%;
max-width:470px;
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
}

.btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#2563eb;
color:#fff;
font-weight:700;
cursor:pointer;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
}

.btn:disabled{
opacity:0.6;
cursor:not-allowed;
}

.loader{
width:16px;
height:16px;
border:2px solid #fff;
border-top:2px solid transparent;
border-radius:50%;
animation:spin 1s linear infinite;
display:none;
}

@keyframes spin{
0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}
}

.status{
text-align:center;
margin-top:10px;
font-weight:600;
}
.success{color:green;}
.error{color:red;}
</style>
</head>

<body>

<div class="container">

<h2>SkillEarn Business</h2>

<!-- LOGIN -->
<div>
<input class="input" id="loginEmail" placeholder="Email">
<input class="input" id="loginPassword" type="password" placeholder="Password">

<button class="btn" id="loginBtn" onclick="login()">
<span class="loader" id="loginLoader"></span>
<span>Login</span>
</button>
</div>

<hr>

<!-- REGISTER -->
<div>
<input class="input" id="name" placeholder="Business Name">
<input class="input" id="country" placeholder="Country">
<input class="input" id="email" placeholder="Email">
<input class="input" id="phone" placeholder="Phone">
<input class="input" id="password" type="password" placeholder="Password">

<button class="btn" id="registerBtn" onclick="register()">
<span class="loader" id="registerLoader"></span>
<span>Create Account</span>
</button>
</div>

<div id="status" class="status"></div>

</div>

<script>
const API = "https://skillearn.onrender.com";

/* =========================
   LOADER CONTROLS
========================= */
function setLoading(btnId, loaderId, state){
document.getElementById(btnId).disabled = state;
document.getElementById(loaderId).style.display = state ? "block" : "none";
}

/* =========================
   CAPTCHA WRAPPER
========================= */
function getCaptcha(action){
return new Promise((resolve, reject)=>{
grecaptcha.ready(()=>{
grecaptcha.execute('6Lel28gsAAAAAMKCUTsgpVkpivxqwUel3n-4vpNx', {
action: action
}).then(token=>{
resolve(token);
}).catch(err=>{
reject(err);
});
});
});
}

/* =========================
   LOGIN
========================= */
async function login(){

setLoading("loginBtn","loginLoader",true);

try{

const token = await getCaptcha("login");

const res = await fetch(API + "/api/auth/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:document.getElementById("loginEmail").value,
password:document.getElementById("loginPassword").value,
recaptchaToken:token
})
});

const data = await res.json();
showStatus(data.access ? "Login successful" : data.message || "Failed", data.access ? "success" : "error");

}catch(e){
showStatus("Error occurred","error");
}

setLoading("loginBtn","loginLoader",false);
}

/* =========================
   REGISTER
========================= */
async function register(){

setLoading("registerBtn","registerLoader",true);

try{

const token = await getCaptcha("register");

const res = await fetch(API + "/api/auth/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:document.getElementById("name").value,
country:document.getElementById("country").value,
email:document.getElementById("email").value,
phone:document.getElementById("phone").value,
password:document.getElementById("password").value,
recaptchaToken:token
})
});

const data = await res.json();
showStatus(data.id ? "Registered successfully" : data.message || "Failed", data.id ? "success" : "error");

}catch(e){
showStatus("Error occurred","error");
}

setLoading("registerBtn","registerLoader",false);
}

/* =========================
   STATUS
========================= */
function showStatus(msg,type){
const el = document.getElementById("status");
el.innerText = msg;
el.className = "status " + type;
}
</script>

</body>
</html>

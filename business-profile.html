<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Business Profile</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    font-family:sans-serif;
}

.nav-btn{
    transition:.25s;
}

.nav-btn:active{
    transform:scale(.85);
}

</style>

</head>

<body class="bg-slate-100">

<div id="app"></div>


<script>

const vendor =
JSON.parse(

localStorage.getItem(
"business_user"
)

);


const token =
localStorage.getItem(
"business_token"
);


if(
!token
){

window.location =
"business-login.html";

}




render();




function render(){

document
.getElementById(
"app"
)
.innerHTML = `

<div class="
p-4
pb-24">





<div class="
bg-blue-600
text-white
rounded-[28px]
p-8
shadow-xl
mb-5">




<div class="
w-20
h-20
rounded-full
bg-white
text-blue-600
text-3xl
font-bold
flex
items-center
justify-center
mx-auto
mb-4">

${getInitial()}

</div>




<h2 class="
text-center
text-2xl
font-bold">

${vendor.business_name}

</h2>




<p class="
text-center
opacity-90
mt-2">

${vendor.email}

</p>




<p class="
text-center
opacity-90
mt-1">

${vendor.country}

</p>




</div>







<div class="
grid
grid-cols-2
gap-4
mb-5">




${stat(
"💳",
"Escrow",
"0"
)}

${stat(
"💼",
"Campaigns",
"0"
)}

${stat(
"📥",
"Submissions",
"0"
)}

${stat(
"✅",
"Approved",
"0"
)}



</div>








<div class="
bg-white
rounded-[28px]
shadow
p-5">




${menu(
"💳",
"Payment History",
"business-payments.html"
)}

${menu(
"🔒",
"Reset Password",
"business-forgot-password.html"
)}

${menu(
"📄",
"Terms",
"#"
)}

${menu(
"🚪",
"Logout",
"javascript:logout()"
)}




</div>

</div>








<div class="
fixed
bottom-0
left-0
right-0
bg-white
shadow-2xl
border-t
grid
grid-cols-4
p-3
text-center">

${nav(
"🏠",
"business-dashboard.html"
)}

${nav(
"💼",
"business-create-job.html"
)}

${nav(
"🔔",
"business-notifications.html"
)}

${nav(
"👤",
"business-profile.html"
)}

</div>

`;

}




function getInitial(){

if(
!vendor ||
!vendor.business_name
){
return "S";
}


return vendor
.business_name
.charAt(0)
.toUpperCase();

}




function stat(
icon,
name,
value
){

return `

<div class="
bg-white
rounded-[24px]
shadow
p-5
text-center">

<div class="
text-2xl
mb-2">

${icon}

</div>


<p class="
text-slate-500
text-sm">

${name}

</p>


<h3 class="
font-bold
text-xl
mt-1">

${value}

</h3>

</div>

`;

}




function menu(
icon,
name,
page
){

return `

<a

href="${page}"

class="
flex
justify-between
items-center
py-4
border-b">




<div class="
flex
gap-3">

<span>

${icon}

</span>


<span class="
font-semibold">

${name}

</span>

</div>




<span>

›

</span>




</a>

`;

}




function nav(
icon,
page
){

return `

<a

href="${page}"

class="
nav-btn
text-2xl">

${icon}

</a>

`;

}




function logout(){

localStorage.removeItem(
"business_token"
);


localStorage.removeItem(
"business_user"
);


window.location =
"business-login.html";

}

</script>

</body>
</html>

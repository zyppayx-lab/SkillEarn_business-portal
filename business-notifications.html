<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Notifications</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    font-family:sans-serif;
}

.nav-btn{
    transition:.25s;
}

.nav-btn:active{
    transform:scale(.85);
}

.fade-card{
    animation:fade .35s ease;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>

</head>

<body class="bg-slate-100">

<div id="app"></div>


<div
id="loader"

class="
fixed
inset-0
bg-black/10
z-50
flex
items-center
justify-center">

<div class="
w-16
h-16
rounded-full
border-[5px]
border-blue-100
border-t-blue-600
animate-spin
bg-white">
</div>

</div>



<script>

const token =
localStorage.getItem(
"business_token"
);


if(
!token
){

window.location =
"business-login.html";

}


load();




async function load(){

try{


/*
future endpoint:
GET /api/business/notifications
*/


const data = [

{
icon:"✅",
title:"Admin Approved",
body:"Your vendor account is active"
},

{
icon:"💳",
title:"Payment Received",
body:"Escrow funding completed"
},

{
icon:"📥",
title:"New Submission",
body:"A worker submitted proof"
},

{
icon:"💼",
title:"Campaign Active",
body:"Job is now live"
}

];



document
.getElementById(
"loader"
)
.style.display =
"none";



render(
data
);


}catch{

window.location =
"business-login.html";

}

}




function render(items){

document
.getElementById(
"app"
)
.innerHTML = `

<div class="
p-4
pb-24">




<div class="
mb-5">

<h1 class="
text-2xl
font-bold">

Notifications

</h1>


<p class="
text-slate-500">

Business alerts

</p>

</div>





${
items.map(

item=>`

<div class="
fade-card
bg-white
rounded-[24px]
shadow
p-5
mb-4">




<div class="
flex
gap-4">




<div class="
text-2xl">

${item.icon}

</div>





<div>




<h3 class="
font-bold">

${item.title}

</h3>




<p class="
text-slate-500
mt-1">

${item.body}

</p>




</div>

</div>

</div>

`

).join("")

}

</div>







<div class="
fixed
bottom-0
left-0
right-0
bg-white
shadow-2xl
border-t
grid
grid-cols-4
p-3
text-center">

${nav(
"🏠",
"business-dashboard.html"
)}

${nav(
"💼",
"business-create-job.html"
)}

${nav(
"🔔",
"business-notifications.html"
)}

${nav(
"👤",
"business-profile.html"
)}

</div>

`;

}




function nav(
icon,
page
){

return `

<a

href="${page}"

class="
nav-btn
text-2xl">

${icon}

</a>

`;

}

</script>

</body>
</html>

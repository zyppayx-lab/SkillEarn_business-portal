<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notifications</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div id="app"></div>

<div
id="loader"
class="
fixed
inset-0
flex
items-center
justify-center
bg-black/10
">

Loading...

</div>



<script>

"use strict";


const API =
"https://skillearn.onrender.com";


const token =
localStorage.getItem(
    "business_token"
);


if(!token){

    location =
    "business-login.html";

}



fetch(

    API+
    "/api/business/notifications",

    {

        headers:{

            Authorization:
            "Bearer "+
            token

        }

    }

)

.then(

    async res=>{

        const items =
        await res.json();



        document
        .getElementById(
            "loader"
        )
        .remove();



        document
        .getElementById(
            "app"
        )
        .innerHTML = `

            <div class="
                p-4
                pb-24
            ">

                <h1 class="
                    text-2xl
                    font-bold
                    mb-5
                ">

                    Notifications

                </h1>



                ${

                    Array.isArray(
                        items
                    )

                    &&

                    items.length

                    ?

                    items.map(

                        item=>`

                            <div class="
                                bg-white
                                rounded-3xl
                                shadow
                                p-5
                                mb-4
                            ">

                                <h3 class="
                                    font-bold
                                ">

                                    ${item.title||"Notification"}

                                </h3>



                                <p class="
                                    text-slate-500
                                    mt-1
                                ">

                                    ${item.message||""}

                                </p>



                                <p class="
                                    text-xs
                                    mt-2
                                ">

                                    ${item.created_at||""}

                                </p>

                            </div>

                        `

                    ).join("")

                    :

                    `

                        <div class="
                            bg-white
                            rounded-3xl
                            p-5
                            text-center
                        ">

                            No notifications

                        </div>

                    `

                }

            </div>

        `;

    }

)

.catch(

    err=>{

        document
        .getElementById(
            "loader"
        )
        .remove();



        document
        .getElementById(
            "app"
        )
        .innerHTML = `

            <div class="
                p-5
                text-red-600
            ">

                ERROR:

                ${err.message}

            </div>

        `;

    }

);

</script>

</body>
</html>

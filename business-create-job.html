<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Create Campaign</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100">

<div id="app"></div>

<div
id="loader"
class="
hidden
fixed
inset-0
bg-black/10
flex
items-center
justify-center">

<div class="
w-16
h-16
rounded-full
border-[5px]
border-blue-100
border-t-blue-600
animate-spin">
</div>

</div>


<script>

const API=
"https://skillearn.onrender.com";


const token=
localStorage.getItem(
"business_token"
);


const vendor=
JSON.parse(
localStorage.getItem(
"business_user"
));


if(!token){

location=
"business-login.html";

}


render();



function render(){

document.getElementById(
"app"
).innerHTML=`

<div class="
p-4
pb-24">

<h1 class="
text-2xl
font-bold
mb-6">

Create Campaign

</h1>



<div class="
bg-white
rounded-3xl
p-6
shadow">



<select
id="purpose"

onchange="toggleFields()"

class="
w-full
border
p-4
rounded-2xl
mb-4">

<option value="social">
Social Task
</option>

<option value="freelance">
Freelance Job
</option>

<option value="hiring">
Hiring Job
</option>

<option value="influencer">
Influencer Job
</option>

</select>



<input
id="title"

placeholder="Title"

class="
w-full
border
p-4
rounded-2xl
mb-4">



<textarea
id="description"

placeholder="Description"

class="
w-full
border
p-4
rounded-2xl
h-28
mb-4">
</textarea>



<input
id="link"

placeholder="Page / Video / Website Link"

class="
w-full
border
p-4
rounded-2xl
mb-4">



<input
id="qty"

value="1"
type="number"

placeholder="Workers"

class="
w-full
border
p-4
rounded-2xl
mb-5">



<button
onclick="payNow()"

class="
w-full
bg-blue-600
text-white
py-4
rounded-2xl
font-bold">

Continue Payment

</button>

</div>

</div>

`;

}


function toggleFields(){

const purpose=
document.getElementById(
"purpose"
).value;


const qty=
document.getElementById(
"qty"
);


const link=
document.getElementById(
"link"
);


if(
purpose==="social"
){

qty.style.display=
"block";

link.style.display=
"block";

}else{

qty.style.display=
"none";

link.style.display=
"none";

}

}



async function payNow(){

loader(true);


try{


const purpose=
document.getElementById(
"purpose"
).value;


const payload={

email:
vendor.email,

purpose,

category:
"default",

title:
document.getElementById(
"title"
).value,

description:
document.getElementById(
"description"
).value,

link:
document.getElementById(
"link"
).value,

qty:
document.getElementById(
"qty"
).value

};



await fetch(

API+
"/api/business/create-campaign",

{

method:"POST",

headers:{

Authorization:
"Bearer "+token,

"Content-Type":
"application/json"

},

body:
JSON.stringify(
payload
)

}

);



let endpoint;


if(
vendor.country==="NG"
){

endpoint=
"/api/paystack/create-payment";

}else{

endpoint=
"/api/crypto/create-payment";

}



const pay=
await fetch(

API+endpoint,

{

method:"POST",

headers:{

Authorization:
"Bearer "+token,

"Content-Type":
"application/json"

},

body:
JSON.stringify(
payload
)

}

);


const data=
await pay.json();


loader(false);



if(
data.payment_url
){

location=
data.payment_url;

return;

}


if(
data.invoice_url
){

location=
data.invoice_url;

return;

}


alert(
"Payment failed"
);


}catch{

loader(false);

alert(
"Failed"
);

}

}



function loader(show){

const el=
document.getElementById(
"loader"
);


if(show){

el.classList.remove(
"hidden"
);

}else{

el.classList.add(
"hidden"
);

}

}


toggleFields();

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Campaign</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div id="app"></div>

<div
id="loader"
class="hidden fixed inset-0 bg-black/10 z-50 flex items-center justify-center">

<div class="
w-16
h-16
rounded-full
border-[5px]
border-blue-100
border-t-blue-600
animate-spin">
</div>

</div>


<div
id="toast"
class="hidden fixed bottom-5 left-4 right-4 z-50">
</div>


<script>

"use strict";

const API =
"https://skillearn.onrender.com";

const token =
localStorage.getItem(
"business_token"
);

if(!token){
location =
"business-login.html";
}

let pricing = null;

start();


async function start(){

await getPricing();

render();

updateUI();

updatePrice();

}



async function getPricing(){

const res =
await fetch(

API +
"/api/business/pricing",

{
headers:{
Authorization:
"Bearer " +
token
}
}

);

pricing =
await res.json();

}



function render(){

document.getElementById(
"app"
).innerHTML = `

<div class="p-4 pb-20">

<div class="mb-6">

<h1 class="
text-2xl
font-bold">
Create Campaign
</h1>

<p class="text-slate-500">
Social tasks or jobs
</p>

</div>


<div class="
bg-white
rounded-[28px]
shadow-xl
p-6">

<select
id="purpose"
onchange="
updateUI();
updatePrice();
"

class="
w-full
border
p-4
rounded-2xl
mb-4">

<option value="social">
Social Task
</option>

<option value="freelance">
Freelance Job
</option>

<option value="hiring">
Hiring Job
</option>

<option value="influencer">
Influencer Job
</option>

</select>



<input
id="title"
placeholder="Title"

class="
w-full
border
p-4
rounded-2xl
mb-4">



<textarea
id="description"
placeholder="Description"

class="
w-full
border
p-4
rounded-2xl
mb-4
h-28">
</textarea>



<input
id="link"
placeholder="Social link"

class="
w-full
border
p-4
rounded-2xl
mb-4">



<input
id="qty"
type="number"
value="1"
min="1"
oninput="updatePrice()"

class="
w-full
border
p-4
rounded-2xl
mb-4">



<input
id="budget"
type="number"
placeholder="Budget"
oninput="updatePrice()"

class="
w-full
border
p-4
rounded-2xl
mb-4">



<div class="
bg-slate-100
rounded-2xl
p-5
mb-5">

<p class="text-slate-500">
Amount
</p>

<h1
id="price"

class="
text-2xl
font-bold">
0
</h1>

</div>



<button
onclick="createCampaign()"

class="
w-full
bg-blue-600
text-white
py-4
rounded-2xl
font-bold">

Create

</button>

</div>

</div>

`;

}



function updateUI(){

const purpose =
value(
"purpose"
);

const link =
document.getElementById(
"link"
);

const qty =
document.getElementById(
"qty"
);

const budget =
document.getElementById(
"budget"
);



if(
purpose==="social"
){

link.style.display =
"block";

qty.style.display =
"block";

budget.style.display =
"none";

}else{

link.style.display =
"none";

qty.style.display =
"none";

budget.style.display =
purpose==="hiring"
? "none"
: "block";

}

}



function updatePrice(){

if(!pricing){
return;
}

const purpose =
value(
"purpose"
);

let amount = 0;



if(
purpose==="social"
){

amount =

pricing.social.amount *

Number(
value("qty")
);

}



if(
purpose==="freelance"
){

amount =
Number(
value("budget")
|| 0
);

}



if(
purpose==="hiring"
){

amount =
pricing.hiring;

}



if(
purpose==="influencer"
){

amount =
Number(
value("budget")
|| 0
);

}



document.getElementById(
"price"
).innerHTML =
amount.toLocaleString();

}



async function createCampaign(){

loader(true);

try{

const purpose =
value(
"purpose"
);

let endpoint;

let payload = {

title:
value(
"title"
),

description:
value(
"description"
)

};



if(
purpose==="social"
){

endpoint =
"/api/business/create-social-task";

payload.link =
value(
"link"
);

payload.qty =
Number(
value(
"qty"
)
);

}



if(
purpose==="freelance"
){

endpoint =
"/api/business/create-freelance";

payload.budget =
Number(
value(
"budget"
)
);

}



if(
purpose==="hiring"
){

endpoint =
"/api/business/create-hiring";

}



if(
purpose==="influencer"
){

endpoint =
"/api/business/create-influencer";

payload.budget =
Number(
value(
"budget"
)
);

}



const res =
await fetch(

API +
endpoint,

{

method:"POST",

headers:{

Authorization:
"Bearer " +
token,

"Content-Type":
"application/json"

},

body:
JSON.stringify(
payload
)

}

);



const data =
await res.json();

loader(false);

toast(
data.message
);



if(
res.ok
){

setTimeout(()=>{

location =
"business-dashboard.html";

},1200);

}

}catch{

loader(false);

toast(
"Connection failed"
);

}

}



function value(id){

return document
.getElementById(id)
.value;

}



function loader(show){

document
.getElementById(
"loader"
)
.classList[

show
? "remove"
: "add"

](
"hidden"
);

}



function toast(msg){

const t =
document.getElementById(
"toast"
);

t.innerHTML = `

<div class="
bg-blue-600
text-white
p-4
rounded-2xl
text-center
font-semibold">

${msg}

</div>

`;

t.classList.remove(
"hidden"
);

setTimeout(()=>{

t.classList.add(
"hidden"
);

},2500);

}

</script>

</body>
</html>

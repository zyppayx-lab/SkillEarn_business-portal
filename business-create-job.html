<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Campaign</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div id="app"></div>


<div
id="loader"

class="
hidden
fixed
inset-0
bg-black/10
z-50
flex
items-center
justify-center">

<div class="
w-16
h-16
rounded-full
border-[5px]
border-blue-100
border-t-blue-600
animate-spin">
</div>

</div>



<div
id="toast"

class="
hidden
fixed
bottom-5
left-4
right-4
z-50">
</div>



<script>

"use strict";


const API =
"https://skillearn.onrender.com";


const token =
localStorage.getItem(
"business_token"
);


const vendor =
JSON.parse(

localStorage.getItem(
"business_user"
) || "{}"

);


let pricing = null;



if(!token){

location =
"business-login.html";

}



start();




async function start(){

try{

await getPricing();

render();

updatePrice();

}catch{

location =
"business-dashboard.html";

}

}




async function getPricing(){

const res =
await fetch(

API +
"/api/business/pricing",

{

headers:{

Authorization:
"Bearer " +
token

}

}

);


pricing =
await res.json();

}






function render(){

document.getElementById(
"app"
).innerHTML = `

<div class="
p-4
pb-20">




<div class="
mb-6">

<h1 class="
text-2xl
font-bold">

Create Campaign

</h1>



<p class="
text-slate-500">

Social tasks or jobs

</p>

</div>





<div class="
bg-white
rounded-[28px]
shadow-xl
p-6">




<select
id="purpose"

onchange="
toggleFields();
updatePrice();
"

class="
w-full
border
p-4
rounded-2xl
mb-4">

<option value="social">
Social Task
</option>

<option value="freelance">
Freelance Job
</option>

<option value="hiring">
Hiring Job
</option>

<option value="influencer">
Influencer Job
</option>

</select>




<input
id="title"

placeholder="Title"

class="
w-full
border
p-4
rounded-2xl
mb-4">




<textarea
id="description"

placeholder="Description"

class="
w-full
border
p-4
rounded-2xl
mb-4
h-28">
</textarea>




<input
id="link"

placeholder="Social link"

class="
w-full
border
p-4
rounded-2xl
mb-4">




<input
id="qty"

value="1"
type="number"

min="1"

oninput="
updatePrice()
"

class="
w-full
border
p-4
rounded-2xl
mb-4">




<div class="
bg-slate-100
rounded-2xl
p-5
mb-5">

<p class="
text-slate-500">

Amount

</p>

<h1
id="price"

class="
text-2xl
font-bold">
0
</h1>

</div>




<button
onclick="payNow()"

class="
w-full
bg-blue-600
text-white
py-4
rounded-2xl
font-bold">

Connect Payment

</button>




</div>

</div>

`;

}






function toggleFields(){

const purpose =
value(
"purpose"
);


const qty =
document.getElementById(
"qty"
);


const link =
document.getElementById(
"link"
);




if(
purpose==="social"
){

qty.style.display =
"block";

link.style.display =
"block";

}

else{

qty.style.display =
"none";

link.style.display =
"none";

}

}






function updatePrice(){

if(!pricing){
return;
}


const purpose =
value(
"purpose"
);


const qty =
Number(

value(
"qty"
) || 1

);


let amount = 0;




if(
purpose==="social"
){

amount =
Number(
pricing.social?.amount || 0
) * qty;

}




if(
purpose==="freelance"
){

amount =
Number(
pricing.freelance?.min || 0
);

}




if(
purpose==="hiring"
){

amount =
Number(
pricing.hiring || 0
);

}




if(
purpose==="influencer"
){

amount =
Number(
pricing.influencer?.min || 0
);

}




document.getElementById(
"price"
).innerHTML =
amount.toLocaleString();

}






async function payNow(){

loader(true);


try{


const payload = {

business_id:
vendor.id,

vendor_id:
vendor.id,

email:
vendor.email,

business_email:
vendor.email,

business_name:
vendor.business_name,

purpose:
value(
"purpose"
),

category:
"default",

title:
value(
"title"
),

description:
value(
"description"
),

link:
value(
"link"
),

qty:
Number(

value(
"qty"
) || 1

)

};





await fetch(

API +
"/api/business/create-campaign",

{

method:"POST",

headers:{

Authorization:
"Bearer " +
token,

"Content-Type":
"application/json"

},

body:
JSON.stringify(
payload
)

}

);





let endpoint;




if(
vendor.country==="NG"
){

endpoint =
"/api/paystack/create-payment";

}

else{

endpoint =
"/api/crypto/create-payment";

}





const res =
await fetch(

API +
endpoint,

{

method:"POST",

headers:{

Authorization:
"Bearer " +
token,

"Content-Type":
"application/json"

},

body:
JSON.stringify(
payload
)

}

);





const data =
await res.json();





loader(false);





if(
data.payment_url
){

location =
data.payment_url;

return;

}





if(
data.invoice_url
){

location =
data.invoice_url;

return;

}





toast(

data.message ||

"Payment failed"

);



}catch(error){

console.log(
error
);


loader(false);


toast(
"Payment failed"
);

}

}






function value(id){

return document
.getElementById(
id
).value;

}






function loader(show){

document
.getElementById(
"loader"
)
.classList[

show
? "remove"
: "add"

](
"hidden"
);

}






function toast(msg){

const t =
document.getElementById(
"toast"
);




t.innerHTML = `

<div class="
bg-blue-600
text-white
p-4
rounded-2xl
text-center
font-semibold">

${msg}

</div>

`;




t.classList.remove(
"hidden"
);




setTimeout(()=>{

t.classList.add(
"hidden"
);

},2500);

}

</script>

</body>
  </html>

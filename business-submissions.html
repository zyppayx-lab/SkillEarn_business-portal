<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submissions</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div id="app"></div>


<div
id="loader"
class="
fixed
inset-0
bg-black/10
z-50
flex
items-center
justify-center">

<div class="
w-16
h-16
rounded-full
border-[5px]
border-blue-100
border-t-blue-600
animate-spin
bg-white">
</div>

</div>


<script>

"use strict";


const API =
"https://skillearn.onrender.com";


const token =
localStorage.getItem(
"business_token"
);


if(!token){

location =
"business-login.html";

}


load();




async function load(){

try{

const res =
await fetch(

API+
"/api/business/submissions",

{

headers:{

Authorization:
"Bearer "+
token

}

}

);


let items =
await res.json();


if(
!Array.isArray(
items
)
){
items=[];
}


document
.getElementById(
"loader"
)
.style.display =
"none";


render(
items
);


}catch{

document
.getElementById(
"loader"
)
.style.display =
"none";


render([]);

}

}




function render(
items
){

document
.getElementById(
"app"
)
.innerHTML = `

<div class="
p-4
pb-28">

<h1 class="
text-2xl
font-bold
mb-5">

Submissions

</h1>



${

items.length

?

items.map(

item=>`

<div class="
bg-white
rounded-[28px]
shadow
p-5
mb-4">

<div class="
font-bold
text-lg
mb-2">

${item.user_name||"User"}

</div>



<div class="
text-slate-500
mb-3">

${item.task_title||"Campaign"}

</div>



<div class="
bg-slate-100
rounded-2xl
p-4
mb-4
break-all">

${item.proof||"No proof"}

</div>



<button

onclick="
approve(

${item.id},

'${item.job_type}'

)
"

class="
w-full
bg-blue-600
text-white
py-3
rounded-2xl">

Approve

</button>

</div>

`

).join("")

:

`

<div class="
bg-white
rounded-[28px]
p-6
text-center">

No submissions yet

</div>

`

}

</div>




<div class="
fixed
bottom-0
left-0
right-0
bg-white
border-t
grid
grid-cols-4
p-3
text-center">

<a href="business-dashboard.html" class="text-2xl">🏠</a>

<a href="business-create-job.html" class="text-2xl">➕</a>

<a href="business-submissions.html" class="text-2xl">📥</a>

<a href="business-profile.html" class="text-2xl">👤</a>

</div>

`;

}




async function approve(
id,
type
){

let endpoint =
"/api/business/approve-submission";


let key =
"submission_id";



if(
type==="freelance"
){

endpoint =
"/api/business/approve-freelance";


key =
"application_id";

}



if(
type==="hiring"
){

endpoint =
"/api/business/approve-hiring";


key =
"application_id";

}



if(
type==="influencer"
){

endpoint =
"/api/business/approve-influencer";


key =
"application_id";

}



await fetch(

API+
endpoint,

{

method:"POST",

headers:{

Authorization:
"Bearer "+
token,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

[key]:id

})

}

);


load();

}

</script>

</body>
  </html>

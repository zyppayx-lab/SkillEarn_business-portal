<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Submissions</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    font-family:sans-serif;
}

.btn:active{
    transform:scale(.97);
}

</style>

</head>

<body class="bg-slate-100">

<div id="app"></div>


<div
id="loader"

class="
fixed
inset-0
bg-black/10
z-50
flex
items-center
justify-center">

<div class="
w-16
h-16
rounded-full
border-[5px]
border-blue-100
border-t-blue-600
animate-spin
bg-white">
</div>

</div>


<div
id="toast"

class="
hidden
fixed
bottom-6
left-4
right-4
z-50">
</div>



<script>

const API =
"https://skillearn.onrender.com";


const token =
localStorage.getItem(
"business_token"
);


if(
!token
){

window.location =
"business-login.html";

}


load();




async function load(){

try{


/*
replace with real endpoint:
GET /api/business/submissions
*/


const data = [

{
id:1,
user_name:"Worker One",
task:"Instagram Follow",
status:"PENDING"
},

{
id:2,
user_name:"Worker Two",
task:"TikTok Follow",
status:"PENDING"
}

];



document
.getElementById(
"loader"
)
.style.display =
"none";



render(
data
);


}catch{

window.location =
"business-login.html";

}

}




function render(items){

document
.getElementById(
"app"
)
.innerHTML = `

<div class="
p-4
pb-20">




<div class="
mb-5">

<h1 class="
text-2xl
font-bold">

Proof Submissions

</h1>


<p class="
text-slate-500">

Review worker proofs

</p>

</div>





${
items.map(

item=>`

<div class="
bg-white
rounded-[24px]
shadow
p-5
mb-4">




<h3 class="
font-bold
text-lg">

${item.user_name}

</h3>



<p class="
text-slate-500
mb-4">

${item.task}

</p>





<div class="
grid
grid-cols-2
gap-3">




<button

onclick="
approve(
${item.id}
)
"

class="
btn
bg-blue-600
text-white
py-3
rounded-2xl
font-bold">

Approve

</button>





<button

onclick="
reject(
${item.id}
)
"

class="
btn
bg-slate-200
py-3
rounded-2xl
font-bold">

Reject

</button>




</div>

</div>

`

).join("")

}

</div>

`;

}




async function approve(id){

showLoader();


try{


const res =
await fetch(

API+
"/api/business/approve-submission",

{

method:"POST",

headers:{

Authorization:
"Bearer "+
token,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

submission_id:id

})

}

);



const data =
await res.json();


hideLoader();


showToast(
data.message ||
"Approved"
);


setTimeout(()=>{

load();

},1000);



}catch{

hideLoader();

showToast(
"Approval failed"
);

}

}




function reject(id){

showToast(
"Rejected"
);

}




function showLoader(){

document
.getElementById(
"loader"
)
.style.display =
"flex";

}




function hideLoader(){

document
.getElementById(
"loader"
)
.style.display =
"none";

}




function showToast(message){

const toast =
document
.getElementById(
"toast"
);


toast.innerHTML = `

<div class="
bg-blue-600
text-white
p-4
rounded-2xl
shadow-xl
text-center
font-semibold">

${message}

</div>

`;


toast
.classList
.remove(
"hidden"
);



setTimeout(()=>{

toast
.classList
.add(
"hidden"
);

},2500);

}

</script>

</body>
</html>

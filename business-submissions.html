<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submissions</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div id="app"></div>

<script>

const API =
"https://skillearn.onrender.com";


const token =
localStorage.getItem(
"business_token"
);

if(!token){

location =
"business-login.html";

}


load();



async function load(){

const res =
await fetch(

API+
"/api/business/submissions",

{

headers:{

Authorization:
"Bearer "+
token

}

}

);


const items =
await res.json();


render(
items
);

}



function render(items){

document
.getElementById(
"app"
)
.innerHTML = `

<div class="
p-4
pb-20">

<h1 class="
text-2xl
font-bold
mb-5">

Proofs

</h1>

${
items.map(
item=>`

<div class="
bg-white
rounded-3xl
shadow
p-5
mb-4">

<p>
${item.user_name}
</p>

<p>
${item.task_title}
</p>

<p>
${item.proof}
</p>

<button

onclick="
approve(
${item.id}
)
"

class="
bg-blue-600
text-white
px-5
py-2
rounded-xl
mt-4">

Approve

</button>

</div>

`
).join("")
}

</div>

`;

}



async function approve(id){

await fetch(

API+
"/api/business/approve-submission",

{

method:"POST",

headers:{

Authorization:
"Bearer "+
token,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

submission_id:id

})

}

);


load();

}

</script>

</body>
</html>

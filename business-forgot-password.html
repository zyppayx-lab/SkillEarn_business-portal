<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Business Password Reset</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    font-family:sans-serif;
}

.btn:active{
    transform:scale(.97);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.card{
    animation:fade .35s ease;
}

</style>

</head>

<body class="bg-slate-100">

<div id="app"></div>


<div
id="loader"

class="
hidden
fixed
inset-0
bg-black/10
z-50
flex
items-center
justify-center">

<div class="
w-16
h-16
rounded-full
border-[5px]
border-blue-100
border-t-blue-600
bg-white
animate-spin
shadow-xl">
</div>

</div>


<div
id="toast"

class="
hidden
fixed
bottom-6
left-4
right-4
z-50">
</div>



<script>

const API =
"https://skillearn.onrender.com";


let step = 1;


render();




function render(){

const savedEmail =
localStorage.getItem(
"business_email"
) || "";


document
.getElementById(
"app"
)
.innerHTML = `

<div class="
min-h-screen
flex
items-center
justify-center
p-4">

<div class="
w-full
max-w-md
card">



<div class="
text-center
mb-8">

<div class="
w-20
h-20
rounded-full
bg-blue-600
mx-auto
mb-4
flex
items-center
justify-center
text-white
text-3xl
font-bold
shadow-xl">

🔒

</div>



<h1 class="
text-3xl
font-bold">

Reset Password

</h1>


<p class="
text-slate-500
mt-2">

Business Portal

</p>

</div>





<div class="
bg-white
rounded-[28px]
shadow-xl
p-6">




<input
id="email"

value="${savedEmail}"

type="email"

placeholder="Business email"

class="
w-full
border
p-4
rounded-2xl
mb-4">



${
step===2 ?

`

<input
id="otp"

placeholder="OTP"

maxlength="6"

class="
w-full
border
p-4
rounded-2xl
mb-4
text-center">



<input
id="password"

type="password"

placeholder="New password"

class="
w-full
border
p-4
rounded-2xl
mb-4">

`

:

""

}




<button
onclick="${
step===1
?
'sendOTP()'
:
'resetPassword()'
}"

class="
btn
w-full
bg-blue-600
text-white
py-4
rounded-2xl
font-bold">

${
step===1
?
'Send OTP'
:
'Reset Password'
}

</button>




<div class="
text-center
mt-5">

<a
href="business-login.html"

class="
text-blue-600
font-semibold">

Back to Login

</a>

</div>




</div>

</div>

</div>

`;

}





async function sendOTP(){

showLoader();


try{


const email =
document
.getElementById(
"email"
)
.value
.trim();


const res =
await fetch(

API+
"/api/business/forgot-password",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
email
})

}

);


const data =
await res.json();


hideLoader();


showToast(
data.message
);


if(res.ok){

localStorage.setItem(
"business_email",
email
);

step = 2;

setTimeout(
render,
1000
);

}


}catch{

hideLoader();

showToast(
"Connection failed"
);

}

}





async function resetPassword(){

showLoader();


try{


const res =
await fetch(

API+
"/api/business/reset-password",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

email:
document
.getElementById(
"email"
)
.value
.trim(),

otp:
document
.getElementById(
"otp"
)
.value
.trim(),

new_password:
document
.getElementById(
"password"
)
.value

})

}

);


const data =
await res.json();


hideLoader();


showToast(
data.message
);



if(res.ok){

setTimeout(()=>{

window.location =
"business-login.html";

},1500);

}



}catch{

hideLoader();

showToast(
"Connection failed"
);

}

}





function showLoader(){

document
.getElementById(
"loader"
)
.classList
.remove(
"hidden"
);

}



function hideLoader(){

document
.getElementById(
"loader"
)
.classList
.add(
"hidden"
);

}



function showToast(message){

const toast =
document
.getElementById(
"toast"
);


toast.innerHTML = `

<div class="
bg-blue-600
text-white
p-4
rounded-2xl
shadow-xl
text-center
font-semibold">

${message}

</div>

`;


toast
.classList
.remove(
"hidden"
);



setTimeout(()=>{

toast
.classList
.add(
"hidden"
);

},2500);

}

</script>

</body>
</html>

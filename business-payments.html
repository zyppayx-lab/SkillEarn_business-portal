<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payments</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div id="app"></div>

<script>

const API =
"https://skillearn.onrender.com";


const token =
localStorage.getItem(
"business_token"
);


const vendor =
JSON.parse(
localStorage.getItem(
"business_user"
));

if(!token){

location =
"business-login.html";

}


load();



function money(){

return vendor.country==="NG"
? "₦"
: "$";

}



async function load(){

const res =
await fetch(

API+
"/api/business/payments",

{

headers:{

Authorization:
"Bearer "+
token

}

}

);


const items =
await res.json();


render(
items
);

}



function render(items){

document
.getElementById(
"app"
)
.innerHTML = `

<div class="
p-4
pb-20">

<h1 class="
text-2xl
font-bold
mb-5">

Payments

</h1>

${
items.map(
item=>`

<div class="
bg-white
rounded-3xl
shadow
p-5
mb-4">

<p>
${item.purpose}
</p>

<p>
${money()}
${item.amount}
</p>

<p>
${item.method}
</p>

<p>
${item.reference}
</p>

</div>

`
).join("")
}

</div>

`;

}

</script>

</body>
</html>

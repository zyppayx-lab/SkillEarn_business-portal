<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payments</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div id="app"></div>


<div id="loader"
class="
fixed
inset-0
bg-black/10
z-50
flex
items-center
justify-center">

<div class="
w-16 h-16 rounded-full border-[5px]
border-blue-100 border-t-blue-600
animate-spin bg-white"></div>

</div>



<script>

"use strict";


const app =
document.getElementById(
"app"
);


const loader =
document.getElementById(
"loader"
);


const token =
localStorage.getItem(
"business_token"
);


const vendor =
JSON.parse(

localStorage.getItem(
"business_user"
) || "{}"

);


if(!token){

location =
"business-login.html";

}



load();




function money(){

return vendor.country==="NG"
? "₦"
: "$";

}






function load(){

fetch(

"https://skillearn.onrender.com/api/business/payments",

{

headers:{

Authorization:
"Bearer "+token

}

}

)

.then(

async res=>{

let items =
await res.json();



if(
    Array.isArray(
        items
    )
){}

else if(
    Array.isArray(
        items.payments
    )
){

items =
items.payments;

}

else if(
    Array.isArray(
        items.data
    )
){

items =
items.data;

}

else{

items = [];

}



loader.remove();



render(
items
);

}

)

.catch(

()=>{

loader.remove();



render([]);

}

);

}






function render(
items
){

let html =
"";



if(
items.length===0
){

html = `

<div class="
bg-white
rounded-[28px]
p-6
text-center
shadow">

No payments yet

</div>

`;

}

else{

for(

let item of items

){

html += `

<div class="
bg-white
rounded-[28px]
shadow
p-5
mb-4">




<p class="
font-semibold
mb-2">

${item.purpose || "Payment"}

</p>




<p class="
text-blue-600
font-bold
mb-2">

${money()}
${Number(
item.amount || 0
).toLocaleString()}

</p>




<p class="
text-slate-500
mb-1">

${item.method || "Method"}

</p>




<p class="
text-slate-500
mb-1">

${item.reference || "Reference"}

</p>




<p class="
text-green-600
font-semibold">

${item.status || "Completed"}

</p>




</div>

`;

}

}



app.innerHTML = `

<div class="
p-4
pb-28">




<h1 class="
text-2xl
font-bold
mb-5">

Payments

</h1>




<button

onclick="
location.reload()
"

class="
w-full
bg-blue-600
text-white
py-3
rounded-2xl
mb-5">

Refresh Escrow

</button>




${html}




</div>




<div class="
fixed
bottom-0
left-0
right-0
bg-white
border-t
grid
grid-cols-4
p-3
text-center">

<a href="business-dashboard.html" class="text-2xl">🏠</a>
<a href="business-create-job.html" class="text-2xl">➕</a>
<a href="business-notifications.html" class="text-2xl">🔔</a>
<a href="business-profile.html" class="text-2xl">👤</a>

</div>

`;

}

</script>

</body>
  </html>

async function registerVendor(){

const business_name =
document.getElementById(
"business_name"
).value.trim();

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;

const country =
document.getElementById(
"country"
).value;


if(
!business_name ||
!email ||
!password
){

showToast(
"Fill all fields"
);

return;

}


showLoader();


try{

const res =
await fetch(

API+
"/api/business/register",

{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

business_name,
email,
password,
country

})

}

);


const data =
await res.json();


hideLoader();


showToast(
data.message
);


if(
res.ok &&
data.message==="OTP sent"
){

localStorage.setItem(
"business_email",
email
);


setTimeout(()=>{

window.location=
"business-verify-email.html";

},1200);

}


}catch{

hideLoader();

showToast(
"Connection failed"
);

}

}



function showLoader(){

document
.getElementById(
"loader"
)
.classList
.remove(
"hidden"
);

}



function hideLoader(){

document
.getElementById(
"loader"
)
.classList
.add(
"hidden"
);

}



function showToast(message){

const toast =
document.getElementById(
"toast"
);


toast.innerHTML=`

<div class="
bg-blue-600
text-white
p-4
rounded-2xl
shadow-xl
text-center
font-semibold">

${message}

</div>

`;


toast.classList.remove(
"hidden"
);


setTimeout(()=>{

toast.classList.add(
"hidden"
);

},2500);

}
